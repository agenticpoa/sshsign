# golangci-lint v2 config for sshsign.
#
# Conservative starter set: enable the linters that catch real bugs,
# disable noise. Tune up over time rather than enabling everything at
# once and drowning in nolint comments.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Bug-catchers (the core value of running lint):
    - errcheck      # unchecked errors
    - govet         # printf format, struct tags
    - ineffassign   # ineffectual assignments
    - staticcheck   # comprehensive static analysis
    - unused        # unused vars/funcs/types
    - nilerr        # returning nil when err is non-nil
    # Narrow extras:
    - bodyclose     # ResponseBody not closed (production code only)
    - misspell      # common English typos in comments
    - unconvert     # unnecessary type conversions
    - gocritic      # tuned tightly via disabled-tags below

  settings:
    errcheck:
      # Patterns where the discard is deliberate. Each entry is either
      # a function whose return value we intentionally ignore (writers
      # to SSH sessions are best-effort; closing already-closed
      # resources is fine; parsing legacy JSON in storage rows is
      # well-formed by construction so unmarshal errors are ignored).
      exclude-functions:
        - (encoding/json.Encoder).Encode
        - encoding/json.Unmarshal
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Sscanf
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
      check-blank: false

    gocritic:
      # Drop the style tag — too many opinionated checks for a
      # first lint pass. Keep diagnostic (real bugs) and
      # performance (real wins).
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - hugeParam
        - paramTypeCombine

    govet:
      # Default vet checks are enabled implicitly. `shadow` is
      # informational, surfaces 28 instances of the idiomatic
      # `if err := ...; err != nil` pattern across the codebase,
      # not worth fighting.

    misspell:
      locale: US

    staticcheck:
      # Disable the QF* quickfix family — these are stylistic
      # suggestions (use tagged switch, drop embedded field selector,
      # Fprintf vs WriteString+Sprintf) that don't catch bugs. Keep
      # SA* (security advisories), ST* (style errors that are real),
      # and S* (simplifications) on.
      checks:
        - all
        - "-QF*"

  exclusions:
    rules:
      # Tests discard errors and skip Close patterns liberally; the
      # bug-catcher value is much lower in test code anyway.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gocritic
      # The audit logger goroutine intentionally fires-and-forgets
      # CloseSession during reconnect.
      - path: internal/audit/immudb\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
