# golangci-lint v2 config for sshsign.
#
# Conservative starter set: enable the linters that catch real bugs,
# disable noise. Tune up over time rather than enabling everything at
# once and drowning in nolint comments.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Default linters that catch real bugs:
    - errcheck
    - govet         # printf format, struct tags, shadowing, etc.
    - ineffassign   # ineffectual assignments
    - staticcheck   # comprehensive static analysis
    - unused        # unused vars/funcs/types
    # Extras worth running:
    - bodyclose     # ResponseBody not closed
    - gocritic      # broad set of opinionated checks (we'll tune)
    - misspell      # common English typos in comments
    - nilerr        # returning nil when err is non-nil
    - unconvert     # unnecessary type conversions

  settings:
    errcheck:
      # writeJSON deliberately ignores the encoder error; the response
      # is best-effort and the caller has already decided to send
      # something. Don't fight this.
      exclude-functions:
        - (encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
      check-blank: false

    gocritic:
      disabled-checks:
        - ifElseChain        # we use if/else chains intentionally
        - hugeParam          # signatures with big structs are fine
        - paramTypeCombine   # readability trade-off
      enabled-tags:
        - diagnostic
        - performance
        - style

    govet:
      enable:
        - shadow

    misspell:
      locale: US

  exclusions:
    # Tests intentionally use t.Logf / Errorf with raw output; don't
    # fight printf-shape checks there.
    rules:
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
